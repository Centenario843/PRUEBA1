!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CENTENARIO ALIMENTOS - NÚCLEO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0e14;
            --sidebar-bg: #11161d;
            --card-bg: #ffffff;
            --text-main: #8b949e;
            --border: #30363d;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-dark);
        }

        /* LOGIN STYLE */
        #login-screen {
            display: flex; align-items: center; justify-content: center;
            height: 100vh; background-color: var(--bg-dark);
        }
        .login-card {
            background-color: white; padding: 40px; border-radius: 30px;
            width: 350px; text-align: center; box-shadow: 0 10px 50px rgba(0,0,0,0.5);
        }
        .logo-main {
            width: 140px; height: 140px; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; overflow: hidden;
        }
        .logo-main img { width: 100%; height: auto; object-fit: cover; }

        .login-card h2 { color: #1a1a1a; font-size: 20px; margin-bottom: 5px; font-weight: 800; }
        .login-card p { color: #666; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 30px; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 10px; font-weight: bold; color: #1a1a1a; margin-bottom: 5px; text-transform: uppercase; }
        
        input, select {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd;
            background: #f8f9fa; color: #333; box-sizing: border-box; outline: none;
        }

        .btn-access {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: #a9b7d1; color: white; cursor: pointer;
            font-weight: bold; text-transform: uppercase; margin-top: 10px;
        }

        /* MAIN SYSTEM STYLE */
        #main-system { display: none; height: 100vh; grid-template-columns: 260px 1fr; }
        .sidebar { background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 20px; color: white; }
        .sidebar-logo { width: 60px; height: 60px; margin-bottom: 20px; border-radius: 50%; overflow: hidden; background: white; }
        .sidebar-logo img { width: 100%; height: auto; }
        
        .content { padding: 40px; overflow-y: auto; background: #f0f2f5; color: #333; }

        /* LABELS 5x7cm */
        .etiqueta {
            width: 7cm; height: 5cm; background: black; color: white;
            border: 2px solid white; border-radius: 15px; padding: 15px;
            box-sizing: border-box; display: flex; flex-direction: column;
            justify-content: space-between; page-break-inside: avoid;
        }
        .et-pre { font-size: 36px; font-weight: bold; text-align: center; font-family: Arial; }
        .et-det { font-size: 16px; text-align: center; font-family: Arial; font-weight: bold; text-transform: uppercase; }

        @media print {
            .no-print { display: none !important; }
            #main-system { display: block; }
            .content { padding: 0; background: white; }
            .etiqueta { border: 2px solid black; margin-bottom: 5px; }
        }
    </style>
</head>
<body>

    <div id="login-screen" class="no-print">
        <div class="login-card">
            <div class="logo-main">
                <img src="https://raw.githubusercontent.com/Centenario843/ETIQUETAS/main/LOGO%20REDONDO.jpeg" alt="Logo Centenario">
            </div>
            <h2>CENTENARIO ALIMENTOS</h2>
            <p>Gestión Centralizada</p>
            
            <div class="form-group">
                <label>Estación de Trabajo</label>
                <select><option>ADMINISTRADOR</option></select>
            </div>

            <div class="form-group">
                <label>Clave Digital</label>
                <input type="password" id="pass" placeholder="••••••••">
            </div>

            <button class="btn-access" onclick="entrar()">ACCEDER AL NÚCLEO <i class="fa-solid fa-chevron-right"></i></button>
            <p style="margin-top: 20px; font-size: 9px; color: #999;">CENTENARIO ALIMENTOS © 2026</p>
        </div>
    </div>

    <div id="main-system">
        <div class="sidebar no-print">
            <div class="sidebar-logo">
                <img src="https://raw.githubusercontent.com/Centenario843/ETIQUETAS/main/LOGO%20REDONDO.jpeg" alt="Logo">
            </div>
            <h3 style="font-size: 14px;"><i class="fa-solid fa-house"></i> Inicio</h3>
            <div style="cursor:pointer; padding: 10px 0;" onclick="showModule('etiquetas')"><i class="fa-solid fa-tags"></i> Etiquetas</div>
            <div style="cursor:pointer; padding: 10px 0; opacity: 0.4;"><i class="fa-solid fa-truck"></i> Proveedores</div>
        </div>
        
        <div class="content">
            <div id="mod-etiquetas">
                <div class="no-print">
                    <h1>Panel de Etiquetas (5x7cm)</h1>
                    <textarea id="datos" style="width: 100%; height: 120px; padding: 10px;" placeholder="Pega desde Excel: Código | Detalle | Precio"></textarea>
                    <br><br>
                    <button onclick="generar()" style="padding: 12px 25px; background: #2ea043; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">GENERAR ETIQUETAS</button>
                    <button onclick="window.print()" style="padding: 12px 25px; background: #000; color: white; border: none; border-radius: 8px; cursor: pointer; margin-left: 10px;">IMPRIMIR PDF</button>
                </div>
                <div id="contenedor" style="margin-top: 30px; display: flex; flex-wrap: wrap; gap: 15px;"></div>
            </div>
        </div>
    </div>

    <script>
        function entrar() {
            const p = document.getElementById('pass').value;
            if(p === "1234") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-system').style.display = 'grid';
            } else {
                alert("Clave incorrecta");
            }
        }

        function generar() {
            const text = document.getElementById('datos').value;
            const container = document.getElementById('contenedor');
            container.innerHTML = '';
            const lines = text.split('\n');
            lines.forEach(line => {
                const cols = line.split('\t');
                if(cols.length >= 3) {
                    container.innerHTML += `
                        <div class="etiqueta">
                            <div style="font-size: 12px;">CÓD: ${cols[0]}</div>
                            <div class="et-det" contenteditable="true">${cols[1]}</div>
                            <div class="et-pre" contenteditable="true">$${cols[2]}</div>
                            <div style="text-align: center; font-size: 10px; letter-spacing: 2px;">CENTENARIO</div>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>
